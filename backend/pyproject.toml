[project]
name = "review-platform-backend"
version = "0.1.0"
description = "AI 作业 / 实验报告自动评审平台后端（FastAPI + SQLite + MinIO）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "minio>=7.2.7",
    "openpyxl>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
